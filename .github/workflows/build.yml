
name: Build Math AI Player

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q MathAIAutoPlayer-phone-build.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/MathAIAutoPlayer
          gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MathAIAutoPlayer-APK
          path: extracted/MathAIAutoPlayer/app/build/outputs/apk/debug/app-debug.apk
          
